{% set name = "metatomic-torch" %}
{% set version = "0.1.18" %}

package:
  name: python-{{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/metatomic_torch-{{ version }}.tar.gz
  sha256: bcd66d286239c9cf5da3e69e8f36fec41a80770708e3590e18b83e7a4461faa3

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  script_env:
    # Don't build metatomic-torch, but use the already compiled `libmetatomic-torch`
    # package
    - METATOMIC_TORCH_PYTHON_USE_EXTERNAL_LIB='ON'
  ignore_run_exports:
    # pytorch is only used as a Python package, all the pytorch version pinning
    # is happening in libmetatomic-torch
    - libtorch *
    - pytorch *

requirements:
  build:
    - python                                  # [build_platform != target_platform]
    - cross-python_{{ target_platform }}      # [build_platform != target_platform]
    - pytorch                                 # [build_platform != target_platform]
    - python-metatensor-torch >=0.10.0,<0.11  # [build_platform != target_platform]
    # Nothing will be built but we need a correct env to make pip happy
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - make
  host:
    - python
    - pip
    - setuptools >=77
    - packaging >=23
    # We build against the CPU version of torch to not have to deal with CUDA
    # compilers (torch's CMake targets tries to find CUDA compilers even when
    # there is no CUDA code to build). This does not impact the `run`
    # dependency, since torch's `run_exports` are variant agnostic
    - libtorch * cpu*
    - libtorch
    - libmetatomic-torch >={{ version }},<0.2
    - python-metatensor-torch >=0.10.0,<0.11  # [build_platform == target_platform]
  run:
    - python
    - pytorch
    - libmetatomic-torch >={{ version }},<0.2
    - python-metatensor-torch >=0.10.0,<0.11
    - python-metatensor-operations >=0.5.0,<0.6
    - wigners >=0.4.0,<0.5

test:
  imports:
    - metatomic.torch
  # commands:
  #   - pip check
  # requires:
  #   - pip

about:
  home: https://github.com/metatensor/metatomic
  summary: Python bindings for metatomic-torch
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://docs.metatensor.org/metatomic/

extra:
  recipe-maintainers:
    - PicoCentauri
    - Luthaf
    - Haozeke
